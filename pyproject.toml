[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protocolops"
version = "0.1.0"
description = "DeFi docs SEO & content agent — GSC-aware weekly briefs, MDX drafts, and Telegram reports."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Kevin Lance Murray", email = "hello@headwopz.example" }]
keywords = ["seo", "defi", "docs", "search-console", "mcp", "content"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "markdown-it-py>=3.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "google-api-python-client>=2.140",
  "google-auth>=2.32",
  "google-auth-oauthlib>=1.2",
  "mcp>=1.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[project.scripts]
protocolops = "protocolops.cli:app"

[project.urls]
Homepage = "https://github.com/HEADWOPZ/protocolops"
Repository = "https://github.com/HEADWOPZ/protocolops"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
protocolops = ["desk/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
